name: E2E

# Playwright runs against a real Clerk test instance and the deployed API,
# so it needs secrets and is not part of the per-PR checks.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.E2E_API_BASE_URL || 'https://open-roads-am.onrender.com' }}
      NEXT_PUBLIC_MAP_STYLE: https://tiles.openfreemap.org/styles/liberty
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
      E2E_MODERATOR_EMAIL: ${{ vars.E2E_MODERATOR_EMAIL }}
      E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
      E2E_PENDING_REPORT_ID: ${{ vars.E2E_PENDING_REPORT_ID }}
      E2E_LOCKED_REPORT_ID: ${{ vars.E2E_LOCKED_REPORT_ID }}
      E2E_APPROVED_REPORT_ID: ${{ vars.E2E_APPROVED_REPORT_ID }}
      E2E_USER_REPORT_ID: ${{ vars.E2E_USER_REPORT_ID }}
      E2E_GOV_NOTE_REPORT_ID: ${{ vars.E2E_GOV_NOTE_REPORT_ID }}
    steps:
      - name: Check that E2E secrets are configured
        id: secrets
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::notice::E2E_CLERK_SECRET_KEY / E2E_CLERK_PUBLISHABLE_KEY are not set; skipping Playwright."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/web
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.configured == 'true'
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
